<!DOCTYPE html>
<html lang="pt-br">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>AstroBlog - Explorando o Universo</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
</head>
<body class="bg-[#030014] text-slate-100 min-h-screen font-sans antialiased selection:bg-purple-500 selection:text-white">

  <header class="bg-[#0b0726]/60 backdrop-blur-md border-b border-purple-500/20 sticky top-0 z-50 shadow-[0_4px_30px_rgba(147,51,234,0.1)]">
    <div class="max-w-6xl mx-auto px-4 py-4 flex justify-between items-center">
      <div class="flex items-center space-x-3">
        <div class="bg-gradient-to-tr from-purple-600 to-indigo-500 p-2.5 rounded-xl text-white shadow-lg shadow-purple-500/40">
          <i class="fa-solid fa-meteor text-xl"></i>
        </div>
        <h1 class="text-xl font-bold tracking-wide bg-gradient-to-r from-purple-400 via-indigo-300 to-cyan-400 bg-clip-text text-transparent">
          AstroBlog
        </h1>
      </div>
      <span class="text-xs font-medium px-3 py-1 rounded-full bg-purple-500/10 text-purple-300 border border-purple-500/30 shadow-[0_0_15px_rgba(168,85,247,0.2)]">
        <i class="fa-solid fa-satellite text-[10px] mr-1"></i> Edição espacial
      </span>
    </div>
  </header>

  <main class="max-w-6xl mx-auto px-4 py-12">
    <div class="text-center mb-14">
      <div class="inline-block mb-3 px-3 py-1 rounded-full bg-indigo-500/10 border border-indigo-500/30 text-indigo-400 text-xs tracking-wider uppercase font-semibold">
        Mistérios do Cosmos
      </div>
      <h2 class="text-3xl md:text-5xl font-extrabold tracking-tight mb-4 bg-gradient-to-r from-white via-purple-200 to-slate-400 bg-clip-text text-transparent">
        Explorando o Universo Profundo
      </h2>
      <p class="text-purple-300/70 max-w-xl mx-auto text-sm md:text-base">
        Acompanhe descobertas astronômicas, missões espaciais e os segredos que orbitam fora da Terra.
      </p>
    </div>

    <div id="posts-container" class="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-3 gap-6"></div>
  </main>

  <footer class="text-center py-8 text-xs text-purple-400/50 border-t border-purple-950/50 mt-20">
    <p>Transmitindo do espaço sideral para a sua tela 🚀</p>
  </footer>

  <script>
    const API_URL = 'http://localhost:3000/api';
    const postsContainer = document.getElementById("posts-container");

    async function fetchPosts() {
      try {
        const response = await fetch(`${API_URL}/posts`);
        const posts = await response.json();
        renderPosts(posts);
      } catch (error) {
        postsContainer.innerHTML = `
          <div class="col-span-full text-center py-12 text-rose-400 bg-rose-500/10 rounded-2xl border border-rose-500/20">
            <i class="fa-solid fa-triangle-exclamation text-3xl mb-2"></i>
            <p>Erro ao conectar com a estação base. Verifique se o servidor Node.js está rodando.</p>
          </div>`;
      }
    }

    function renderPosts(posts) {
      postsContainer.innerHTML = "";
      posts.forEach(post => {
        const postEl = document.createElement("div");
        postEl.className = "bg-[#0a061d]/80 border border-purple-500/20 rounded-2xl p-6 shadow-xl flex flex-col justify-between transition-all duration-300 hover:border-purple-500/60 hover:shadow-[0_0_25px_rgba(147,51,234,0.15)] group";

        postEl.innerHTML = `
          <div>
            <div class="flex items-center justify-between mb-4">
              <span class="text-xs font-semibold px-2.5 py-1 rounded-md bg-purple-950/80 text-purple-300 border border-purple-800/50">
                <i class="fa-solid fa-star text-[9px] mr-1 text-yellow-400"></i> Setor 0${post.id}
              </span>
              <i class="fa-solid fa-orbit text-purple-500/40 group-hover:text-purple-400 transition-colors"></i>
            </div>
            <h3 class="text-lg font-bold text-slate-100 mb-2 leading-snug group-hover:text-purple-300 transition-colors">${post.title}</h3>
            <p class="text-purple-200/60 text-sm leading-relaxed mb-6">${post.body}</p>
          </div>
          <div>
            <button onclick="loadComments(${post.id}, this)" 
              class="w-full py-2.5 px-4 bg-gradient-to-r from-purple-600 to-indigo-600 hover:from-purple-500 hover:to-indigo-500 text-white font-medium rounded-xl text-sm transition-all duration-200 shadow-lg shadow-purple-600/30 flex items-center justify-center space-x-2">
              <i class="fa-regular fa-comment"></i>
              <span>Ver transmissões (comentários)</span>
            </button>
            <div class="comments hidden mt-4 pt-4 border-t border-purple-950 space-y-3 text-sm"></div>
          </div>
        `;

        postsContainer.appendChild(postEl);
      });
    }

    async function loadComments(postId, buttonEl) {
      const commentWrapper = buttonEl.nextElementSibling;
      
      if (!commentWrapper.classList.contains("hidden")) {
        commentWrapper.classList.add("hidden");
        buttonEl.innerHTML = `<i class="fa-regular fa-comment"></i><span>Ver transmissões (comentários)</span>`;
        return;
      }

      buttonEl.innerHTML = `<i class="fa-solid fa-spinner animate-spin"></i><span>Sintonizando...</span>`;

      try {
        const response = await fetch(`${API_URL}/posts/${postId}/comments`);
        const comments = await response.json();

        if (comments.length === 0) {
          commentWrapper.innerHTML = `<p class="text-purple-400/50 italic text-xs">Nenhuma transmissão registrada ainda.</p>`;
        } else {
          commentWrapper.innerHTML = comments.map(c => `
            <div class="bg-[#030014]/60 p-3 rounded-xl border border-purple-900/50">
              <span class="block font-medium text-purple-400 text-xs mb-1">
                <i class="fa-solid fa-user-astronaut mr-1"></i> ${c.email}
              </span>
              <p class="text-slate-300 text-xs">${c.body}</p>
            </div>
          `).join("");
        }

        commentWrapper.classList.remove("hidden");
        buttonEl.innerHTML = `<i class="fa-solid fa-chevron-up"></i><span>Ocultar transmissões</span>`;
      } catch (error) {
        buttonEl.innerHTML = `<i class="fa-regular fa-comment"></i><span>Ver transmissões (comentários)</span>`;
        alert("Erro ao receber sinal do servidor.");
      }
    }

    fetchPosts();
  </script>
</body>
</html>
